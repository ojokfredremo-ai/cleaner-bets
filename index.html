<!DOCTYPE html>
<html>
<head>
  <title>Cleaner Bets</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      max-width: 420px;
      margin: auto;
      padding: 20px;
      background: #fff;
    }

    .card {
      background: #f4f4f4;
      padding: 15px;
      border-radius: 12px;
      margin: 10px 0;
    }

    button {
      padding: 10px 12px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    .win { background: green; }
    .loss { background: red; }
    .reset { background: black; }

    #profit {
      font-size: 28px;
      color: green;
    }
  </style>
</head>

<body>

  <h1>Cleaner Bets 📊</h1>

  <div class="card">
    <h2 id="profit">0 UGX</h2>
    <p>Profit</p>
  </div>

  <div class="card">
    <h3>Stats</h3>
    <p>Wins: <span id="wins">0</span></p>
    <p>Losses: <span id="losses">0</span></p>
    <p id="winrate">Win Rate: 0%</p>
  </div>

  <div class="card">
    <p id="insight">System ready...</p>
  </div>

  <button class="win" onclick="win()">+5000 Win</button>
  <button class="loss" onclick="loss()">-5000 Loss</button>
  <button class="reset" onclick="reset()">Reset</button>

  <hr>

  <canvas id="chart" width="300" height="150"></canvas>

  <script src="app.js"></script>

</body>
</html>
