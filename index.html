<div style="max-width:420px;margin:auto;font-family:Arial;text-align:center">

  <h1>Cleaner Bets 📊</h1>

  <div style="background:#f4f4f4;padding:10px;margin:10px;border-radius:10px">
    <h2 id="profit">0 UGX</h2>
    <p>Total Profit</p>
  </div>

  <div style="display:flex;justify-content:space-around;margin:10px">

    <div>
      <h3 id="wins">0</h3>
      <p>Wins</p>
    </div>

    <div>
      <h3 id="losses">0</h3>
      <p>Losses</p>
    </div>

  </div>

  <div>
    <p id="winrate">Win Rate: 0%</p>
  </div>

  <button onclick="win()">+5000 Win</button>
  <button onclick="loss()">-5000 Loss</button>
  <button onclick="reset()">Reset</button>

  <hr>

  <h3>Performance Chart</h3>
  <canvas id="chart" width="300" height="150"></canvas>

</div>

<script src="app.js"></script>
